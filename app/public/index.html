<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Check-up gratuito del ristorante: in 2 minuti il punteggio del tuo locale, dove perdi soldi e quanto margine puoi recuperare.">
<meta property="og:title" content="Quanto guadagna davvero il tuo ristorante?">
<meta property="og:description" content="Check-up gratuito in 2 minuti di Restaurant Business Revolution.">
<meta property="og:type" content="website">
<meta name="robots" content="index,follow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>RBR Check-up Ristorante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: wizard a schermate (home → domande con scontrino live → scansione a step → report con pannello punteggio fisso a sinistra) */
:root{
  --paper:#FFFFFF; --surface:#FFFFFF; --sunk:#EDE9E9; --ink:#141112; --muted:#6E6466; --line:#E3DCDC;
  --red:#D90A0F; --red-ink:#B5080C; --red-soft:#FBE5E5;
  --good:#1D8048; --good-soft:#E2F2E8; --warn:#C27800; --warn-soft:#FBF0DA; --bad:#C3221B; --bad-soft:#FBE3E1;
  --stage:#FFF6F6; --stage-ink:#141112; --stage-muted:#6E6466; --stage-line:#EBDADA;
  --thermal:#FFFEFA; --thermal-ink:#2A2526;
  --shadow:0 1px 2px rgba(20,17,18,.06),0 8px 28px rgba(20,17,18,.07);
  --f-display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --f-body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
/* Solo tema chiaro: lo sfondo nero non si legge (Roberto, 26/10/2026) */
:root{color-scheme:light}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:6px}
.wrap{max-width:1220px;margin:0 auto;padding-inline:20px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;padding-block:18px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.brand img{width:34px;height:auto;display:block}
.brand img.logo{width:auto;height:44px}
.brand .bar{width:3px;align-self:stretch;background:var(--ink);margin-inline:2px}
.wordmark{font-family:var(--f-display);font-weight:800;font-stretch:100%;font-size:12.5px;line-height:1.02;letter-spacing:-.01em;text-align:left}
.wordmark span{display:block;color:var(--red)} .wordmark span.b{color:var(--ink)}
.btn-ghost{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:border-color .2s}
.btn-ghost:hover{border-color:var(--ink)}

.screen{animation:screenIn .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* HOME */
.home{padding-block:clamp(40px,9vh,110px) 60px;text-align:center}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--red-ink);font-weight:500}
.home h1{font-size:clamp(34px,5.6vw,64px);font-weight:800;font-stretch:108%;letter-spacing:-.035em;line-height:.98;margin:18px auto 0;max-width:22ch}
.home h1 em{font-style:normal;color:var(--red);position:relative;white-space:nowrap}
.home h1 em::after{content:"";position:absolute;left:0;right:0;bottom:.04em;height:.09em;background:var(--red);transform:scaleX(0);transform-origin:left;animation:underline .9s .5s cubic-bezier(.7,0,.2,1) forwards}
@keyframes underline{to{transform:scaleX(1)}}
.home .lead{color:var(--muted);font-size:clamp(16px,1.6vw,19px);max-width:52ch;margin:20px auto 0}
.search{margin:36px auto 0;max-width:680px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:grid;grid-template-columns:1.4fr 1fr auto;align-items:stretch;text-align:left;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--ink)}
.search label{display:flex;flex-direction:column;padding:14px 18px;min-width:0}
.search label+label{border-left:1px solid var(--line)}
.search small{font-size:12px;color:var(--muted);font-weight:600}
.search input{border:0;background:transparent;outline:0;font-size:17px;font-weight:600;padding:2px 0 0;min-width:0;width:100%}
.search input::placeholder{color:var(--muted);opacity:.6;font-weight:500}
.go{margin:10px;border:0;border-radius:14px;background:var(--red);color:#fff;padding:0 22px;display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;transition:transform .15s,background .2s}
.go:hover{background:var(--red-ink)} .go:active{transform:scale(.97)}
.go svg{transition:transform .2s} .go:hover svg{transform:translateX(3px)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px 7px 8px;font-size:14px;cursor:pointer;transition:transform .2s,border-color .2s}
.chip:hover{transform:translateY(-2px);border-color:var(--ink)}
.chip i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:600}
.chip:nth-child(1) i{background:var(--red-soft);color:var(--red-ink)}
.chip:nth-child(2) i{background:var(--warn-soft);color:var(--warn)}
.chip:nth-child(3) i{background:var(--good-soft);color:var(--good)}
.trust{margin-top:26px;font-size:14px;color:var(--muted);display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.trust b{color:var(--ink);font-weight:600}
.linkish{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:600}
.previews{margin:56px auto 0;max-width:860px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;text-align:left;box-shadow:var(--shadow);animation:float 6s ease-in-out infinite;display:flex;gap:14px;align-items:center;min-width:0}
.pv:nth-child(2){animation-delay:-2s} .pv:nth-child(3){animation-delay:-4s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.pv .k{font-size:12px;color:var(--muted);font-weight:600}
.pv .v{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.pv .v.red{color:var(--bad)}

/* QUIZ */
.quiz{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:40px;padding-block:20px 60px;align-items:start}
.qhead{display:flex;align-items:center;gap:14px}
.back{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.back:disabled{opacity:.35;cursor:default}
.prog{flex:1;height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--red);border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.qcount{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:48px;text-align:right}
.qbody{margin-top:44px;max-width:640px}
.qbody.anim{animation:qIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes qIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.qbody h2{font-size:clamp(28px,3.6vw,42px);font-weight:800;font-stretch:104%;letter-spacing:-.03em;line-height:1.04;margin-top:10px}
.qbody .desc{color:var(--muted);margin-top:12px;max-width:56ch}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:30px}
.opts.list{grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;transition:border-color .15s,transform .15s,background .15s;min-width:0}
.opt:hover{border-color:var(--ink);transform:translateY(-1px)}
.opt.sel{border-color:var(--red);background:var(--red-soft)}
.opt .key{flex:none;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--paper)}
.opt.sel .key{background:var(--red);border-color:var(--red);color:#fff}
.opt b{display:block;font-weight:700;font-size:16.5px}
.opt small{display:block;color:var(--muted);font-size:13.5px;margin-top:1px}
.sl{margin-top:34px}
.sl+.sl{margin-top:30px}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sl-top label{font-weight:700}
.sl-val{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4vw,44px);letter-spacing:-.03em;line-height:1}
.track{position:relative;margin-top:16px;height:34px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin:0;position:relative;z-index:2;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--red) 0 var(--p,50%),var(--sunk) var(--p,50%) 100%)}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--red) 0 var(--p,50%),var(--sunk) var(--p,50%) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--surface);border:3px solid var(--red);margin-top:-10px;box-shadow:0 2px 8px rgba(0,0,0,.18);transition:transform .15s}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--red);box-shadow:0 2px 8px rgba(0,0,0,.18)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}
.tick{position:absolute;top:-4px;width:2px;height:42px;background:var(--ink);z-index:1;opacity:.75;pointer-events:none}
.tick span{position:absolute;top:44px;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:var(--muted)}
.sl-hint{margin-top:22px;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.check{display:flex;gap:10px;align-items:center;margin-top:22px;font-size:14.5px;color:var(--muted);cursor:pointer;width:max-content;max-width:100%}
.check input{width:18px;height:18px;accent-color:var(--red)}
.next{margin-top:38px;border:0;border-radius:14px;background:var(--ink);color:var(--paper);padding:15px 26px;font-weight:700;font-size:16px;cursor:pointer;display:inline-flex;gap:10px;align-items:center;transition:transform .15s}
.next:hover{transform:translateY(-1px)}
.next kbd{font-family:var(--f-mono);font-size:11px;opacity:.6;border:1px solid currentColor;border-radius:5px;padding:1px 5px}

/* Tabellina dei costi, si compila mentre rispondi */
.costs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 18px 12px;box-shadow:var(--shadow)}
.costs table{width:100%;border-collapse:collapse;font-size:15px}
.costs th{text-align:right;font-size:12px;font-weight:600;color:var(--muted);padding:8px 0 6px;border-bottom:1px solid var(--line)}
.costs th:first-child{text-align:left}
.costs td{padding:9px 0;border-bottom:1px dashed var(--line);transition:opacity .3s}
.costs td.num{text-align:right;white-space:nowrap;padding-left:12px}
.costs td.pc{color:var(--muted);font-size:13px;width:52px}
.costs tr.pending td{opacity:.35}
.costs tr.flash td{animation:flash .7s}
.costs tr.in td{font-weight:700}
.costs tr.tot td{border-bottom:0;border-top:2px solid var(--ink);font-weight:800;font-size:16px;padding-top:11px}

/* Scontrino (animazione della scansione) */
.receipt-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px)}
.receipt-cap{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.receipt-cap .dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.receipt{background:var(--thermal);color:var(--thermal-ink);font-family:var(--f-mono);font-size:13px;padding:22px 22px 30px;position:relative;box-shadow:0 14px 40px rgba(20,17,18,.14);
  -webkit-mask:radial-gradient(circle 6px at 50% 100%,#0000 98%,#000) 0 0/16px 100% repeat-x;mask:radial-gradient(circle 6px at 50% 100%,#0000 98%,#000) 0 0/16px 100% repeat-x}
.receipt .rh{text-align:center;line-height:1.35}
.receipt .rh b{display:block;font-size:15px;letter-spacing:.04em;text-transform:uppercase;word-break:break-word}
.receipt hr{border:0;border-top:1.5px dashed rgba(42,37,38,.35);margin:14px 0}
.rl{display:flex;justify-content:space-between;gap:10px;padding:3px 0;transition:opacity .3s}
.rl span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl.pending{opacity:.3}
.rl.flash{animation:flash .7s}
@keyframes flash{0%{background:rgba(217,10,15,.18)}100%{background:transparent}}
.rl.total{font-weight:600;font-size:15px;padding-top:6px}
.rl .pc{color:rgba(42,37,38,.55);margin-left:6px}
.barcode{margin-top:16px;height:34px;background:repeating-linear-gradient(90deg,var(--thermal-ink) 0 2px,transparent 2px 4px,var(--thermal-ink) 4px 5px,transparent 5px 8px,var(--thermal-ink) 8px 11px,transparent 11px 12px);opacity:.75}
.receipt .foot{text-align:center;font-size:11px;margin-top:8px;opacity:.6}
.mob-bar{display:none}

/* SCAN */
.scan{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;padding-block:6px 40px}
.scan-side{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;min-height:600px}
.scan-side h3{font-size:20px;font-weight:800;letter-spacing:-.02em}
.scan-side .sub{font-size:13.5px;color:var(--muted);margin-top:4px;word-break:break-word}
.steps{list-style:none;margin:24px 0 0;padding:0;display:flex;flex-direction:column;gap:0}
.steps li{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--muted);padding:7px 0;position:relative;transition:color .3s}
.steps li:not(:last-child)::after{content:"";position:absolute;left:9px;top:28px;height:12px;width:2px;background:var(--line)}
.steps li.done:not(:last-child)::after{background:var(--ink)}
.steps li.sep{padding:10px 0 4px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.steps li.sep::after{display:none}
.steps .ic{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;transition:all .3s}
.steps li.on{color:var(--ink);font-weight:600}
.steps li.on .ic{border-color:var(--line);border-top-color:var(--red);animation:spin .8s linear infinite}
.steps li.done{color:var(--ink)}
.steps li.done .ic{background:var(--ink);border-color:var(--ink);animation:pop .35s}
.steps li.done .ic::after{content:"";width:5px;height:9px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.timer{margin-top:auto;background:var(--paper);border-radius:12px;padding:14px 16px;display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;position:relative;overflow:hidden}
.timer .tbar{position:absolute;left:0;top:0;height:3px;background:var(--ink);transition:width 1s linear}
.timer .spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);animation:spin .8s linear infinite}
.stage{position:relative;border-radius:20px;overflow:hidden;min-height:600px;background:
  radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/22px 22px,var(--paper);border:1px solid var(--line)}
.scanline{position:absolute;left:0;right:0;height:2px;background:var(--red);box-shadow:0 0 24px 6px rgba(217,10,15,.35),0 0 80px 18px rgba(217,10,15,.12);z-index:5;animation:sweep 2.6s cubic-bezier(.45,0,.55,1) infinite;opacity:.9}
@keyframes sweep{0%{top:-4%}50%{top:100%}100%{top:-4%}}
.vis{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px}
.vis.out{animation:visOut .4s forwards}
@keyframes visOut{to{opacity:0;transform:scale(.97)}}
/* step 1: stampante */
.printer{width:min(340px,100%);display:flex;flex-direction:column;align-items:center}
.slot{width:100%;height:16px;border-radius:8px;background:var(--ink);position:relative;z-index:2}
.paperclip{width:88%;overflow:hidden;margin-top:-8px}
.paperclip .receipt{animation:print 2.4s steps(16) both;font-size:12.5px}
@keyframes print{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 -20px 0)}}
/* step 2: carte ingredienti */
.cards{position:relative;width:min(420px,100%);height:440px}
.icard{position:absolute;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;animation:toss .6s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes toss{from{opacity:0;transform:translateY(60px) rotate(var(--rot,0deg)) scale(.9)}to{opacity:1;transform:rotate(var(--rot,0deg))}}
.icard b{font-weight:700}
.icard .amt{font-family:var(--f-display);font-weight:800;font-size:18px}
.icard .ibar{grid-column:1/-1;height:5px;background:var(--sunk);border-radius:5px;overflow:hidden}
.icard .ibar i{display:block;height:100%;background:var(--red);border-radius:5px;transform-origin:left;animation:grow .8s .3s both}
@keyframes grow{from{transform:scaleX(0)}}
.badge-big{position:absolute;right:-6px;bottom:-4px;background:var(--ink);color:var(--paper);border-radius:16px;padding:14px 18px;animation:toss .6s both;box-shadow:var(--shadow);z-index:20}
.badge-big small{display:block;font-size:12px;opacity:.7}
.badge-big b{font-family:var(--f-display);font-size:30px;font-weight:800;letter-spacing:-.02em}
/* step 3: turni */
.shifts{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.shifts .sh-t{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:12px;font-family:var(--f-mono)}
.grid-sh{display:grid;grid-template-columns:34px repeat(16,1fr);gap:3px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);align-items:center}
.grid-sh .c{height:18px;border-radius:3px;background:var(--sunk);transition:background .25s}
.grid-sh .c.on{background:var(--ink)} .grid-sh .c.hot{background:var(--red)}
.sh-foot{margin-top:16px;display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap}
.sh-foot b{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.02em}
/* step 4: bollette */
.bills{position:relative;width:min(380px,100%);height:420px}
.bill{position:absolute;left:8%;right:8%;background:var(--thermal);color:var(--thermal-ink);font-family:var(--f-mono);font-size:12.5px;padding:16px 18px;box-shadow:0 10px 26px rgba(20,17,18,.16);animation:drop .55s cubic-bezier(.3,1.3,.5,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-120px) rotate(var(--rot))}to{opacity:1;transform:rotate(var(--rot))}}
.bill .bt{display:flex;justify-content:space-between;font-weight:600;font-size:13.5px;text-transform:uppercase;letter-spacing:.03em}
.bill .bs{opacity:.6;margin-top:4px}
.bill .stamp{position:absolute;right:14px;bottom:10px;border:2px solid var(--red);color:var(--red);font-weight:600;padding:1px 6px;transform:rotate(-8deg);font-size:11px;letter-spacing:.08em}
/* step 5 e report: cascata */
.wf-box{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.wf{width:100%;height:auto;display:block;overflow:visible}
.wf text{font-family:var(--f-body);fill:var(--muted);font-size:12px}
.wf text.v{fill:var(--ink);font-weight:700;font-size:13px;font-family:var(--f-display)}
.wf .bar{transform-box:fill-box;animation:bar .7s cubic-bezier(.2,.8,.2,1) both}
.wf .bar.dn{transform-origin:top} .wf .bar.up{transform-origin:bottom}
@keyframes bar{from{transform:scaleY(0)}}
.wf .lbl{animation:fadeIn .4s both}
@keyframes fadeIn{from{opacity:0}}
/* step 6: confronto */
.bench{width:min(620px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 24px 30px;box-shadow:var(--shadow)}
.bench h4{margin:0;font-size:15px}
.zone{position:relative;height:56px;margin-top:74px;border-radius:10px;display:flex;overflow:visible}
.zone div{flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:11.5px;font-weight:600;text-align:center;line-height:1.15}
.zone div:nth-child(1){background:var(--bad-soft);color:var(--bad);border-radius:10px 0 0 10px}
.zone div:nth-child(2){background:var(--warn-soft);color:var(--warn)}
.zone div:nth-child(3){background:var(--sunk);color:var(--muted)}
.zone div:nth-child(4){background:var(--good-soft);color:var(--good);border-radius:0 10px 10px 0}
.you{position:absolute;top:-38px;width:2px;margin-left:-1px;transition:left 1.6s cubic-bezier(.2,.8,.2,1);z-index:2}
.you span{position:absolute;bottom:100%;left:0;transform:translateX(var(--tx,0%));background:var(--ink);color:var(--paper);font-size:12px;font-weight:700;border-radius:8px;padding:3px 9px;white-space:nowrap;transition:transform 1.6s cubic-bezier(.2,.8,.2,1)}
.you i{display:block;width:2px;height:62px;background:var(--ink)}
.you{padding-top:0}
.axis{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:8px}

/* REPORT */
.report{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;padding-block:6px 60px;align-items:start}
.score-panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);background:linear-gradient(180deg,var(--red-soft),var(--surface) 60%);border:1px solid var(--line);border-radius:20px;padding:26px 22px;display:flex;flex-direction:column;align-items:center;text-align:center}
.ring{position:relative;display:grid;place-items:center}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .bg{stroke:var(--sunk)}
.ring .fg{transition:stroke-dashoffset 1.8s cubic-bezier(.2,.8,.2,1)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .big{font-family:var(--f-display);font-weight:800;font-size:58px;letter-spacing:-.04em;line-height:1}
.ring .of{font-size:13px;color:var(--muted)}
.grade-l{margin-top:12px;font-size:13.5px;color:var(--muted)}
.grade{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.02em;margin-top:2px}
.subs{width:100%;margin-top:26px;display:flex;flex-direction:column;gap:6px;text-align:left}
.subrow{display:flex;align-items:center;gap:12px;padding:10px 6px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer;width:100%;text-align:left}
.subrow b{display:block;font-size:14.5px}
.subrow small{font-weight:700;font-size:12.5px}
.subrow .sc{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.cta{border:0;border-radius:14px;background:var(--red);color:#fff;font-weight:700;padding:15px 20px;cursor:pointer;width:100%;margin-top:22px;font-size:15.5px;transition:background .2s,transform .15s}
.cta:hover{background:var(--red-ink);transform:translateY(-1px)}
.panel-note{font-size:12.5px;color:var(--muted);margin-top:10px}
.rmain{position:relative;min-width:0}
.rmain.locked .rcontent{filter:blur(7px);pointer-events:none;user-select:none}
.rcontent{transition:filter .8s;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.loss h3{font-size:clamp(22px,2.4vw,28px);font-weight:800;letter-spacing:-.025em;line-height:1.1}
.loss h3 .m{color:var(--bad)}
.who{display:flex;gap:12px;align-items:center;margin-top:16px;padding:10px;background:var(--paper);border-radius:12px}
.who .av{width:42px;height:42px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;flex:none}
.who b{display:block;font-size:14.5px;word-break:break-word} .who small{color:var(--muted);font-size:12.5px}
.plist{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:9px}
.plist li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.plist li .tri{flex:none;margin-top:3px;width:16px;height:14px;background:var(--bad);clip-path:polygon(50% 0,100% 100%,0 100%);position:relative}
.plist li .eur{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;color:var(--bad);white-space:nowrap;padding-left:8px}
.more{font-size:13.5px;color:var(--muted);margin-top:12px}
.card h3.t{font-size:20px;font-weight:800;letter-spacing:-.02em}
.card .st{color:var(--muted);font-size:14px;margin-top:4px}
.ebit-big{font-family:var(--f-display);font-weight:800;font-size:46px;letter-spacing:-.04em;line-height:1;margin-top:14px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-top:10px}
.sec-h h2{font-size:clamp(24px,2.8vw,32px);font-weight:800;letter-spacing:-.03em}
.sec-h p{margin:4px 0 0;color:var(--muted)}
.area{padding:0;overflow:hidden}
.area-h{display:flex;align-items:center;gap:14px;padding:20px 24px;border-bottom:1px solid var(--line)}
.area-h .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.area-h h3{font-size:19px;font-weight:800;letter-spacing:-.02em}
.area-h p{margin:0;color:var(--muted);font-size:13.5px}
.area-h .ring{margin-left:auto}
.items{list-style:none;margin:0;padding:6px 0}
.items li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 14px;padding:12px 24px;align-items:start}
.items li+li{border-top:1px dashed var(--line)}
.items .st-ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.items .ok .st-ic{background:var(--good-soft);color:var(--good)} .items .warn .st-ic{background:var(--warn-soft);color:var(--warn)} .items .bad .st-ic{background:var(--bad-soft);color:var(--bad)}
.items b{font-size:15px;font-weight:700}
.items p{margin:2px 0 0;font-size:13.5px;color:var(--muted);grid-column:2/-1}
.items .val{font-family:var(--f-mono);font-size:13px;font-weight:600;white-space:nowrap}
.items .ok .val{color:var(--good)} .items .warn .val{color:var(--warn)} .items .bad .val{color:var(--bad)}

/* SIMULATORE */
.sim{background:var(--stage);color:var(--stage-ink);border:1px solid var(--stage-line);border-radius:24px;padding:clamp(22px,3.4vw,40px);position:relative;overflow:hidden}
.sim::before{content:"";position:absolute;width:520px;height:520px;right:-180px;top:-220px;background:radial-gradient(circle,rgba(217,10,15,.10),transparent 62%);pointer-events:none}
.sim .eyebrow{color:var(--red-ink)}
.sim h2{font-size:clamp(28px,3.8vw,48px);font-weight:800;font-stretch:108%;letter-spacing:-.035em;line-height:1;margin-top:10px;max-width:18ch;position:relative}
.sim .intro{color:var(--stage-muted);max-width:58ch;margin-top:12px;position:relative}
.sim-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:34px;margin-top:30px;position:relative}
.lever{padding:16px 0;border-top:1px solid var(--stage-line)}
.lever:first-child{border-top:0;padding-top:0}
.lever-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lever-top b{font-size:15px}
.lever-top small{display:block;color:var(--stage-muted);font-size:12.5px;font-weight:500;margin-top:1px}
.lever-top .lv{font-family:var(--f-display);font-weight:800;font-size:22px;white-space:nowrap}
.sim input[type=range]{height:28px}
.sim input[type=range]::-webkit-slider-runnable-track{height:6px;background:linear-gradient(90deg,var(--red) 0 var(--p,50%),var(--stage-line) var(--p,50%) 100%)}
.sim input[type=range]::-moz-range-track{height:6px;background:linear-gradient(90deg,var(--red) 0 var(--p,50%),var(--stage-line) var(--p,50%) 100%)}
.sim input[type=range]::-webkit-slider-thumb{width:22px;height:22px;margin-top:-8px;background:var(--surface);border-color:var(--red)}
.sim input[type=range]::-moz-range-thumb{background:var(--surface);border-color:var(--red)}
.lever .lg{font-family:var(--f-mono);font-size:11.5px;color:var(--stage-muted);display:flex;justify-content:space-between;margin-top:2px}
.out-big{white-space:nowrap;font-family:var(--f-display);font-weight:800;font-size:clamp(38px,4.8vw,66px);letter-spacing:-.045em;line-height:.95;color:var(--ink)}
.out-big .plus{color:var(--red)}
.out-sub{color:var(--stage-muted);margin-top:8px}
.out-sub b{color:var(--stage-ink)}
.compare{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;margin-top:24px;font-size:13.5px}
.compare .cb{height:12px;border-radius:6px;background:var(--stage-line);overflow:hidden}
.compare .cb i{display:block;height:100%;border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.compare .cv{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.tl{margin-top:26px}
.tl svg{width:100%;height:auto;display:block}
.tl text{font-family:var(--f-mono);font-size:11px;fill:var(--stage-muted)}
.tl .ph{font-family:var(--f-body);font-weight:700;font-size:12px;fill:var(--stage-ink)}
.brk{margin-top:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.brk div{background:var(--surface);border:1px solid var(--stage-line);border-radius:12px;padding:10px 12px;min-width:0}
.brk small{display:block;color:var(--stage-muted);font-size:12px}
.brk b{font-family:var(--f-display);font-size:18px;font-weight:800}
.proof{margin-top:26px;border-top:1px solid var(--stage-line);padding-top:18px;font-size:14px;color:var(--stage-muted);position:relative}
.proof b{color:var(--stage-ink)}
.method{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.mstep{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.mstep .mn{font-family:var(--f-mono);font-size:12px;color:var(--red-ink)}
.mstep h4{font-family:var(--f-display);font-size:20px;font-weight:800;letter-spacing:-.02em;margin:6px 0 0}
.mstep p{color:var(--muted);font-size:14px;margin:8px 0 0}
.mstep .when{font-size:12.5px;font-weight:700;margin-top:12px}
.final{text-align:center;padding:40px 24px}
.final h2{font-size:clamp(26px,3.4vw,40px);font-weight:800;letter-spacing:-.03em;max-width:22ch;margin:0 auto}
.final p{color:var(--muted);max-width:52ch;margin:12px auto 0}
.final .cta{width:auto;padding:16px 30px;margin-top:22px}
.disc{font-size:12.5px;color:var(--muted);text-align:center;max-width:70ch;margin:0 auto}

/* Gate */
.gate{position:absolute;inset:0;z-index:10;display:flex;justify-content:center;align-items:flex-start;padding-top:90px}
.gate-box{position:sticky;top:110px;width:min(440px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 30px 80px rgba(20,17,18,.25);text-align:center;animation:screenIn .5s both}
.lock{width:44px;height:44px;border-radius:12px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;margin:0 auto}
.gate-box h3{font-size:26px;font-weight:800;letter-spacing:-.025em;margin-top:14px}
.gate-box p{color:var(--muted);font-size:14.5px;margin:8px 0 0}
.gate form{display:flex;flex-direction:column;gap:10px;margin-top:18px;text-align:left}
.field{display:flex;flex-direction:column;gap:4px}
.field span{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 12px;font-size:15.5px;outline:0}
.field input:focus{border-color:var(--ink)}
.field.err input{border-color:var(--bad)}
.legal{font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.legal input{accent-color:var(--red);margin-top:2px}
.gate .cta{margin-top:6px}
.err-msg{color:var(--bad);font-size:13px;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14.5px;z-index:50;animation:screenIn .4s both;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* Presenza online: scansione */
.map-box{width:min(600px,100%)}
.qbar{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);font-size:15px;font-weight:600;position:relative;z-index:3;min-width:0}
.qbar svg{flex:none;color:var(--muted)}
.qbar .caret{width:1.5px;height:17px;background:var(--ink);animation:blink 1s infinite;flex:none}
.map-wrap{position:relative;margin-top:12px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.map-wrap svg{display:block;width:100%;height:auto}
.mpin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;animation:pinDrop .55s cubic-bezier(.3,1.4,.5,1) both}
@keyframes pinDrop{from{opacity:0;transform:translate(-50%,-160%)}to{opacity:1;transform:translate(-50%,-100%)}}
.mpin span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:var(--shadow)}
.mpin i{width:14px;height:14px;border-radius:50%;background:var(--muted);border:3px solid var(--surface);margin-top:4px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.mpin.me span{background:var(--red);border-color:var(--red);color:#fff}
.mpin.me i{background:var(--red)}
.rcards{position:relative;width:min(440px,100%);height:500px}
.rcard{position:absolute;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow);animation:toss .6s cubic-bezier(.2,.9,.3,1.2) both;font-size:13.5px}
.rcard .rtop{display:flex;align-items:center;gap:10px}
.rcard .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--sunk);flex:none}
.rcard .stars{color:var(--warn);letter-spacing:1px;margin-left:auto;font-size:13px}
.rcard p{margin:6px 0 8px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.reply{display:inline-flex;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px}
.reply.y{background:var(--good-soft);color:var(--good)} .reply.n{background:var(--bad-soft);color:var(--bad)}
.site-vis{display:flex;gap:30px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.phone{width:196px;height:390px;border-radius:30px;border:8px solid var(--ink);background:var(--surface);overflow:hidden;position:relative;flex:none;box-shadow:var(--shadow)}
.phone .url{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:center;padding:8px 6px 6px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk{background:var(--sunk);border-radius:6px;margin:9px 10px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-100%);animation:shimmer 1.4s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.site-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.gauge{width:190px}
.gauge svg{display:block;width:100%;height:auto}
.gauge .gv{font-family:var(--f-display);font-weight:800;font-size:34px;fill:var(--ink)}
.gauge .gl{font-size:11.5px;fill:var(--muted);font-family:var(--f-body)}
.tk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.tk li{display:flex;gap:9px;align-items:center;animation:fadeUp .4s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
.dotst{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:11px;font-weight:800}
.dotst.ok{background:var(--good-soft);color:var(--good)} .dotst.warn{background:var(--warn-soft);color:var(--warn)} .dotst.bad{background:var(--bad-soft);color:var(--bad)}
.soc{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.igbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);width:250px}
.igbox .ih{display:flex;gap:10px;align-items:center;font-size:13px}
.igbox .ih b{display:block;font-size:13.5px}
.igav{width:36px;height:36px;border-radius:50%;padding:2px;background:conic-gradient(var(--warn),var(--red),var(--warn));flex:none}
.igav i{display:block;width:100%;height:100%;border-radius:50%;background:var(--surface);border:2px solid var(--surface)}
.ig{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:12px}
.ig i{aspect-ratio:1;border-radius:3px;animation:toss .45s both;position:relative}
.ig i:nth-child(4n+1){background:var(--red-soft)} .ig i:nth-child(4n+2){background:var(--warn-soft)} .ig i:nth-child(4n+3){background:var(--sunk)} .ig i:nth-child(4n){background:var(--good-soft)}
.ig i.last::after{content:attr(data-d);position:absolute;inset:auto 3px 3px 3px;font-size:9.5px;font-family:var(--f-mono);background:var(--ink);color:var(--paper);border-radius:3px;padding:1px 3px;text-align:center}
.adbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);width:250px;animation:toss .6s .9s both}
.adbox .ak{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.adbox .an{font-family:var(--f-display);font-weight:800;font-size:44px;letter-spacing:-.03em;line-height:1;margin-top:10px}
.adbox p{margin:6px 0 0;color:var(--muted);font-size:13px}
.dl{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 20px;box-shadow:var(--shadow);list-style:none;margin:0}
.dl li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;animation:fadeUp .45s both}
.dl li+li{border-top:1px dashed var(--line)}
.dl b{font-size:15px} .dl small{display:block;color:var(--muted);font-size:12.5px}
/* Presenza online: report */
.expill{font-family:var(--f-mono);font-size:11px;font-weight:600;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:3px 8px;white-space:nowrap}
.rank{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.rank li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;font-size:14px}
.rank li .p{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.rank li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank li .rt{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.rank li .rt em{font-style:normal;color:var(--warn)}
.rank li.me{background:var(--red-soft);font-weight:700}
.rank li.me .p{color:var(--red-ink)}
.qt-wrap{overflow-x:auto;margin-top:12px}
.qt{width:100%;border-collapse:collapse;font-size:14px}
.qt th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.qt td{padding:10px 6px;border-bottom:1px dashed var(--line)}
.qt td:first-child{padding-left:0}
.qt td:not(:first-child),.qt th:not(:first-child){text-align:right;white-space:nowrap}
.pos{font-family:var(--f-mono);font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;white-space:nowrap}
.pos.ok{background:var(--good-soft);color:var(--good)} .pos.warn{background:var(--warn-soft);color:var(--warn)} .pos.bad{background:var(--bad-soft);color:var(--bad)}
.items li.grp{display:block;padding:14px 24px 4px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-top:0}

.search{position:relative}
.ac{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);list-style:none;margin:0;padding:6px;z-index:30;text-align:left}
.ac li button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;cursor:pointer}
.ac li button:hover,.ac li button.on{background:var(--sunk)}
.ac b{display:block;font-size:15.5px} .ac small{color:var(--muted);font-size:13px}
.ac .gattr{font-size:11px;color:var(--muted);text-align:right;padding:4px 10px 2px}
.search.live{grid-template-columns:1fr auto} .search.live label+label{display:none}
.dotst.na{background:var(--sunk);color:var(--muted)}
.items .na .st-ic{background:var(--sunk);color:var(--muted)} .items .na .val{color:var(--muted)}
.gmap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-top:12px;background:var(--sunk);aspect-ratio:16/10}
.gmap img{display:block;width:100%;height:100%;object-fit:cover}
.gmap.nomap{aspect-ratio:auto;background:none;border:0;overflow:visible}
.gmap.nomap .rk{position:static;max-width:none;min-width:0;font-size:15px;padding:14px 16px}
.gmap.nomap .rk div{padding:6px 0}
.gmap .rk{position:absolute;right:10px;bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow);font-size:12.5px;min-width:190px;max-width:70%;animation:toss .6s 1s both}
.gmap .rk div{display:flex;justify-content:space-between;gap:10px;padding:2px 0;white-space:nowrap}
.gmap .rk div span:first-child{overflow:hidden;text-overflow:ellipsis}
.gmap .rk .me{color:var(--red);font-weight:700}
.gattrib{font-size:11px;color:var(--muted);margin-top:6px}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;opacity:0}

.cookie{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;z-index:70;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.cookie p{margin:0;flex:1 1 260px} .cookie a{color:var(--ink)}
.cookie div{display:flex;gap:8px}
.cookie button{border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--surface)}
.cookie button.ok{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Scelta tra le due versioni (numeri / marketing) */
.pick{margin:40px auto 0;max-width:860px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;text-align:left}
.pick a{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:26px;color:inherit;text-decoration:none;box-shadow:var(--shadow);transition:border-color .2s,transform .2s}
.pick a:hover{border-color:var(--red);transform:translateY(-3px)}
.pick .eyebrow{font-size:11px}
.pick h2{font-size:clamp(24px,2.6vw,30px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.pick p{margin:0;color:var(--muted);font-size:15px}
.pick .go{margin:auto 0 0;align-self:flex-start;padding:12px 18px}
.next.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);margin-left:10px}
.next.alt:hover{border-color:var(--ink)}
.opt.ns{border-style:dashed}
.quiz.solo{grid-template-columns:minmax(0,1fr)}

/* Responsive */
@media (max-width:980px){
  .quiz{grid-template-columns:1fr}
  .receipt-col{display:none}
  .mob-bar{display:flex;position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);justify-content:space-between;align-items:center;z-index:20;font-size:14px}
  .mob-bar b{font-family:var(--f-display);font-size:18px}
  .quiz{padding-bottom:110px}
  .scan{grid-template-columns:1fr}
  .scan-side{min-height:0}
  .steps{display:none}
  .timer{margin-top:16px}
  .stage{min-height:480px}
  .report{grid-template-columns:1fr}
  .score-panel{position:relative;top:0}
  .sim-grid{grid-template-columns:1fr}
  .sim-grid>div:last-child{order:-1}
  .vis{padding:16px}
}
@media (max-width:680px){
  .search{grid-template-columns:1fr}
  .search label+label{border-left:0;border-top:1px solid var(--line)}
  .go{justify-content:center;padding:14px}
  .previews{grid-template-columns:1fr;max-width:360px}
  .pv:nth-child(n+2){display:none}
  .opts{grid-template-columns:1fr}
  .pick{grid-template-columns:1fr}
  .next.alt{margin-left:0;margin-top:10px}
  .row2,.method{grid-template-columns:1fr}
  .qbody{margin-top:28px}
  .items li{padding:12px 16px}
  .area-h{padding:16px}
  .card{padding:20px}
  .gate{padding-top:20px}
  .grid-sh{grid-template-columns:28px repeat(16,1fr);gap:2px}
  .phone{width:150px;height:300px}
  .site-vis,.soc{gap:16px}
  .igbox,.adbox{width:100%;max-width:300px}
  .items li.grp{padding:14px 16px 4px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .scanline{display:none}
}
</style>

function countUp(el,to,fmt,dur=1400,from=0){
  if(reduce){el.textContent=fmt(to);return;}
  const t0=performance.now();
  (function f(t){const k=clamp((t-t0)/dur);el.textContent=fmt(from+(to-from)*ease(k));if(k<1)requestAnimationFrame(f);})(t0);
}

/* ---------- Calcolo conto economico ---------- */
function compute(){
  const n=nettoM()*12, t=typeOf();
  const c={netto:n, fcT:t.fc};
  c.food=(S.fornitori??0)*12; c.pers=(S.personale??0)*12; c.aff=(S.affitto??0)*12; c.altri=(S.altri??0)*12; c.mkt=(S.mkt??0)*12;
  c.fc=c.food/n*100; c.pp=c.pers/n*100; c.ap=c.aff/n*100; c.op=c.altri/n*100; c.mp=c.mkt/n*100;
  c.ebit=n-c.food-c.pers-c.aff-c.altri-c.mkt; c.ep=c.ebit/n*100; c.prime=c.fc+c.pp;
  return c;
}
function scores(c,o){
  const fc=12*clamp(1-(c.fc-c.fcT)/10), pe=11*clamp(1-(c.pp-T_PERS)/12), fi=7*clamp(1-((c.ap+c.op)-(T_AFF+T_ALTRI))/10);
  const ce=[0,3,7,10][S.ce??0], sch=[0,3,7,10][S.schede??0];
  const con=[0,3,6,9][S.contatti??0];
  const mk=c.mp<.5?0:c.mp<2?3:c.mp<=5.5?6:4;
  const OC=onlineChecks(o).filter(i=>i.w&&i.s!=='na'), W=OC.reduce((a,i)=>a+i.w,0), D=W?Math.round(35*OC.reduce((a,i)=>a+i.w*(i.s==='ok'?1:i.s==='warn'?.5:0),0)/W):0;
  const A=Math.round(fc+pe+fi), B=Math.max(0,Math.round(ce+sch-(nsNum()>0?2:0))), C=Math.round(con+mk);
  // ogni versione conta solo le sue aree, riportate su 100
  const tot=isM?Math.round((D+C)/50*100):isN?Math.round((A+B+C)/65*100):A+B+C+D;
  return {A,B,C,D,tot};
}
// numeri lasciati a «Non lo so» (solo le domande con un importo)
function nsNum(){ return ['vendite','fornitori','personale','affitto','altri','mkt'].filter(k=>S.ns[k]).length; }
function problems(c,o){
  const n=c.netto, p=[], g=o.google, rk=o.ranking;
  if(!isM){
  if(c.fc>c.fcT+.5) p.push({t:S.ns.fornitori?`Food cost che non conosci: in un locale come il tuo senza controllo è di solito intorno al ${pct(c.fc)} (obiettivo ${c.fcT}%)`:`Food cost al ${pct(c.fc)}, obiettivo ${c.fcT}%`,e:(c.fc-c.fcT)/100*n});
  if(c.pp>T_PERS+.5) p.push({t:S.ns.personale?`Costo del personale che non conosci: stimato al ${pct(c.pp)} del fatturato`:`Personale al ${pct(c.pp)} del fatturato`,e:(c.pp-T_PERS)/100*n*.6});
  if(c.ap+c.op>T_AFF+T_ALTRI+.5) p.push({t:`Costi fissi pesanti: ${pct(c.ap+c.op)}`,e:((c.ap+c.op)-(T_AFF+T_ALTRI))/100*n*.3});
  if((S.ce??0)<=1) p.push({t:'Conto economico guardato troppo di rado',e:.01*n});
  if((S.schede??0)<=1) p.push({t:'Prezzi del menu senza scheda food cost',e:.02*n});
  }
  if((S.contatti??0)<=2) p.push({t:'Clienti che non tornano: database non usato',e:.025*n*((S.contatti??0)===2?.6:1)});
  if(c.mp<1) p.push({t:'Marketing quasi assente',e:.012*n});
  if(isN) return capProblems(p,n);
  if(rk && (rk.pos==null||rk.pos>3)) p.push({t:rk.pos?`Sei ${rk.pos}° su Google Maps per «${rk.query}»`:`Non compari nei primi 20 su Maps per «${rk.query}»`,e:.015*n*(rk.pos==null||rk.pos>7?1:.6)});
  if(g.risposte!=null && g.risposte/g.ultime<.4) p.push({t:`Rispondi a ${g.risposte} recensioni su ${g.ultime}`,e:.006*n});
  if(g.rating!=null && g.rating<4.4) p.push({t:`Voto Google ${String(g.rating).replace('.',',')}: sotto chi ti sta vicino`,e:.015*n});
  if(o.sito.prenotazione===false) p.push({t:'Niente prenotazione online',e:.01*n});
  if(o.sito.pixelMeta===false) p.push({t:'Pubblicità senza tracciamento: non sai quanto ti costa un cliente',e:.004*n+c.mkt*.2});
  if(o.source==='live' && !o.sito.has) p.push({t:'Nessun sito collegato alla scheda Google',e:.01*n});
  return capProblems(p,n);
}
function capProblems(p,n){
  // tetto: mai più del 15% del fatturato, scalato in proporzione
  const tot=p.reduce((a,x)=>a+x.e,0), cap=.15*n;
  if(tot>cap) p.forEach(x=>x.e*=cap/tot);
  return p.sort((a,b)=>b.e-a.e);
}

function attachAutocomplete(form,inp){
  let timer=null, items=[], sel=-1, box=null;
  S.session=uuid();
  const close=()=>{ if(box){box.remove();box=null;} sel=-1; };
  const pick=it=>{ S.place=it; S.nome=it.main; S.citta=(it.sec||'').split(',').map(x=>x.trim()).filter(x=>x&&!/^(italia|italy)$/i.test(x)).slice(-1)[0]||''; inp.value=it.main; close(); S.demo=false; qi=0; startOnline(); quiz(); };
  const render=()=>{ close(); if(!items.length) return;
    box=h(`<ul class="ac" role="listbox">${items.map((it,i)=>`<li><button type="button" role="option" class="${i===sel?'on':''}" data-i="${i}"><b>${esc(it.main)}</b><small>${esc(it.sec)}</small></button></li>`).join('')}<li class="gattr">Suggerimenti da Google</li></ul>`);
    form.appendChild(box); box.querySelectorAll('[data-i]').forEach(b=>b.addEventListener('mousedown',e=>{e.preventDefault(); pick(items[+b.dataset.i]);})); };
  inp.addEventListener('input',()=>{ S.place=null; clearTimeout(timer); const q=inp.value.trim(); if(q.length<3){items=[];close();return;}
    timer=setTimeout(()=>fetch('/api/places?'+new URLSearchParams({q,s:S.session})).then(r=>r.json()).then(j=>{ if(inp.value.trim()!==q) return; items=j.items||[]; sel=-1; render(); }).catch(()=>{}),220); });
  inp.addEventListener('keydown',e=>{ if(!box) return;
    if(e.key==='ArrowDown'){e.preventDefault(); sel=Math.min(items.length-1,sel+1); render();}
    else if(e.key==='ArrowUp'){e.preventDefault(); sel=Math.max(0,sel-1); render();}
    else if(e.key==='Enter'&&sel>=0){e.preventDefault(); pick(items[sel]);}
    else if(e.key==='Escape') close(); });
  inp.addEventListener('blur',()=>setTimeout(close,150));
}

    inner+=`<div class="opts ${q.list?'list':''}" role="radiogroup">${opts.map((o,i)=>{
      const v=o.v??i; const sel= v==='ns' ? ns : (!ns && cur===v);
      return `<button class="opt ${v==='ns'?'ns':''} ${sel?'sel':''}" role="radio" aria-checked="${sel}" data-v="${o.v??i}"><span class="key">${String.fromCharCode(65+i)}</span><span><b>${o.b}</b>${o.s?`<small>${o.s}</small>`:''}</span></button>`;}).join('')}</div>`;
  } else {
    inner+=q.keys.map(k=>`<div class="sl" data-k="${k}">
      <div class="sl-top"><label for="r-${k}">${SL[k].label}</label><div class="sl-val num" id="v-${k}"></div></div>
      <div class="track"><input type="range" id="r-${k}"><div class="tick" id="t-${k}" hidden><span>${SL[k].tlabel||''}</span></div></div>
      <div class="sl-hint" id="h-${k}"></div></div>`).join('');
    inner+=`<div><button class="next" id="nextBtn">${qi===Q.length-1?'Analizza il mio locale':'Continua'}</button>${NO_NS.includes(q.id)?'':`<button class="next alt" id="nsBtn">Non lo so</button>`}</div>`;
    if(S.ns[q.id]) inner+=`<p class="check" style="cursor:default">Hai risposto «Non lo so»: abbiamo messo il valore tipico per un locale come il tuo.</p>`;
  }
  body.innerHTML=inner;
  if(q.kind==='choice'){
    body.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
      const raw=b.dataset.v; const ns=raw==='ns'; const v= q.id==='tipo'? raw : ns? 0 : Number(raw);
      if(q.id==='tipo' && S.tipo!==v){ S.tipo=v; S.scontrino=null; S.fornitori=null; }
      S[ANSWER_KEY[q.id]]=v; S.ns[q.id]=ns;
      body.querySelectorAll('.opt').forEach(x=>{x.classList.toggle('sel',x===b);x.setAttribute('aria-checked',x===b);});
      setTimeout(advance, reduce?0:260);
    }));
  } else {
    q.keys.forEach(k=>{
      const spec=SL[k], r=document.getElementById('r-'+k);
      r.min=spec.min(); r.max=spec.max(); r.step=spec.step;
      if(S[k]>r.max) r.max=Math.ceil(S[k]/1000)*1000;
      r.value=S[k];
      const upd=()=>{
        S[k]=Number(r.value);
        r.style.setProperty('--p',((r.value-r.min)/(r.max-r.min)*100)+'%');
        document.getElementById('v-'+k).textContent=spec.fmt(S[k]);
        document.getElementById('h-'+k).innerHTML=spec.hint();
        if(spec.target){const tk=document.getElementById('t-'+k); const tv=spec.target(); const p=(tv-r.min)/(r.max-r.min);
          if(p>0&&p<1){tk.hidden=false; tk.style.left=`calc(${p*100}% + ${(0.5-p)*28}px - 1px)`;}}
        if(k==='incasso'){const s2=document.getElementById('h-scontrino'); if(s2) s2.innerHTML=SL.scontrino.hint();}
        if(k==='scontrino'){/* ok */}
        renderReceipt(k);
      };
      r.addEventListener('input',()=>{ S.ns[q.id]=false; upd(); }); upd();
    });
    // «Non lo so»: rimette il valore tipico per il tipo di locale e va avanti
    const nb=document.getElementById('nsBtn'); if(nb) nb.addEventListener('click',()=>{
      q.keys.forEach(k=>{ if(k==='incasso') S.incasso=60000; else S[k]=null; });
      S.ns[q.id]=true; defaults(); advance(); });
    document.getElementById('nextBtn').addEventListener('click',advance);
  }
  renderReceipt();
}
function advance(){
  const pb=document.getElementById('progBar'); if(!pb || pb.dataset.done) return;
  if(qi<Q.length-1){qi++;renderQ();} else { pb.dataset.done='1'; pb.style.width='100%'; setTimeout(scan, reduce?0:300);}
}
document.addEventListener('keydown',e=>{
  if(!document.getElementById('qbody')) return;
  const q=Q[qi];
  if(e.key==='Enter' && q.kind==='sliders' && !(e.target instanceof HTMLButtonElement)){e.preventDefault();advance();}
  if(q.kind==='choice' && !e.metaKey && !e.ctrlKey && !(e.target instanceof HTMLInputElement)){const i=e.key.toUpperCase().charCodeAt(0)-65; const b=document.querySelectorAll('.opt')[i]; if(b && e.key.length===1) b.click();}
});

function startOnline(){
  S.online=null; S.scanId=null;
  S.onlineP = cfgReady.then(c=>{
    if(isN) return {...emptyOnline(),source:'salta'};
    if(!c.live || S.demo) return exampleOnline();
    return fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({placeId:S.place?.id||null,nome:S.nome,citta:S.citta,session:S.session})})
      .then(r=>r.json()).then(j=>{ if(!j.id) throw new Error(j.error||'scan'); S.scanId=j.id; return pollScan(j.id); })
      .catch(()=>({source:'errore'}));
  }).then(o=>(S.online=o));
}
// legge lo stato ogni 2 s; si ferma quando la scansione è finita o dopo 70 s
function pollScan(id){
  const t0=Date.now();
  return new Promise(res=>{ (function poll(){
    fetch('/api/scan/'+id).then(r=>r.json()).then(st=>{
      const o=fromServer(st); if(o) S.online=o;
      if(st.status==='done'||Date.now()-t0>70000) return res(o||{source:'errore',error:st.error});
      setTimeout(poll,2000);
    }).catch(()=>{ if(Date.now()-t0>70000) res(S.online||{source:'errore'}); else setTimeout(poll,3000); });
  })(); });
}

  if(!S.onlineP) startOnline();

  let o=S.online;
  if(!o||!o.sito) o=S.online=(o&&o.source==='errore'&&S.online&&S.online.sito)?S.online:emptyOnline();
  const c=compute(), t=typeOf();
  const ALL=[['Google e concorrenti',visMap,1],['Recensioni e risposte',visReviews,1],['Sito web e velocità',visSite,1],['Instagram e campagne Meta',visSocial,1],['Delivery e promozioni',visDelivery,1],
    ['Incassi e scontrino medio',visReceipt,0],['Food cost e fornitori',visFood,0],['Costo del personale',visShifts,0],['Costi fissi',visBills,0],['Margine operativo',visWaterfall,0],['Confronto con il settore',visBench,0]];
  const ST=ALL.filter(x=>isM?x[2]:isN?!x[2]:true), steps=ST.map(x=>x[0]);
  const STEP=reduce?300:isM?1500:1100, TOTAL=STEP*steps.length;
  app.innerHTML='';
  const el=h(`<section class="screen scan">
    <aside class="scan-side">
      <h3>Analisi in corso…</h3>
      <div class="sub">${esc(o.name||S.nome)}${(o.city||S.citta)?' · '+esc(o.city||S.citta):''}</div>
      <ul class="steps">${ST.map((x,i)=>(x[2]&&i===0?'<li class="sep">Presenza online</li>':!x[2]&&(i===0||ST[i-1][2])?'<li class="sep">Conto economico</li>':'')+`<li class="st"><span class="ic"></span>${x[0]}</li>`).join('')}</ul>
      <div class="timer"><i class="tbar" id="tbar" style="width:0"></i><span class="spin"></span><span id="tleft" class="num"></span></div>
    </aside>
    <div class="stage" id="stage"><div class="scanline"></div></div>
  </section>`);
  app.appendChild(el);
  const lis=el.querySelectorAll('.steps li.st'), stage=el.querySelector('#stage');
  const t0=Date.now();
  const tick=setInterval(()=>{const left=Math.max(0,Math.ceil((TOTAL-(Date.now()-t0))/1000));
    const tl=document.getElementById('tleft'); if(!tl){clearInterval(tick);return;}
    tl.textContent= left>0? `${left} secondi rimanenti` : 'Quasi pronto…';
    document.getElementById('tbar').style.width=clamp((Date.now()-t0)/TOTAL)*100+'%';},250);
  let i=0;
  (function run(){
    if(!document.body.contains(stage)) return;
    lis.forEach((li,j)=>{li.classList.toggle('on',j===i);li.classList.toggle('done',j<i);});
    if(i>=steps.length){clearInterval(tick);
      const t1=Date.now(); Promise.race([S.onlineP||Promise.resolve(),new Promise(r=>setTimeout(r,isM?10000:0))]).then(()=>setTimeout(report,Math.max(0,300-(Date.now()-t1))));
      return;}
    el.querySelector('.scan-side h3').textContent= window.innerWidth<=980? steps[i]+'…' : 'Analisi in corso…';
    const old=stage.querySelector('.vis'); if(old){old.classList.add('out');setTimeout(()=>old.remove(),400);}
    const v=h(`<div class="vis"></div>`); stage.appendChild(v); const [,fn,isOnline]=ST[i]; isOnline?fn(v,(S.online&&S.online.sito)?S.online:o):fn(v,c,t);
    // passi più corti: anche le animazioni interne partono prima, così si vedono per intero
    const k=STEP/2900; v.querySelectorAll('[style*="animation-delay"]').forEach(e=>{ const d=parseFloat(e.style.animationDelay); if(d) e.style.animationDelay=(d*k).toFixed(2)+'s'; });
    i++; setTimeout(run,STEP);
  })();
}

/* ---------- Grafici ---------- */
function placeYou(y,ep){ if(!y) return; const f=clamp(ep/20,0.01,.99); y.style.left=f*100+'%'; y.querySelector('span').style.setProperty('--tx',(-f*100)+'%'); }
function ringSVG(size,stroke,frac,color,animate){
  const r=(size-stroke)/2, C=2*Math.PI*r;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle class="bg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${stroke}"/>
    <circle class="fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${animate?C:C*(1-frac)}" data-off="${C*(1-frac)}"/></svg></div>`;
}
function waterfallSVG(c){
  const W=640,H=300,top=28,bot=250,left=10,cw=(W-left*2)/7;
  const items=[['Fatturato',c.netto,'up'],['Fornitori',-c.food,'dn'],['Personale',-c.pers,'dn'],['Affitto',-c.aff,'dn'],['Altri fissi',-c.altri,'dn'],['Marketing',-c.mkt,'dn'],['Margine',c.ebit,'res']];
  const minV=Math.min(0,c.ebit), maxV=c.netto, y=v=>top+(maxV-v)/(maxV-minV)*(bot-top);
  let run=0, out='';
  out+=`<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-width="1.5"/>`;
  items.forEach((it,i)=>{
    const x=left+i*cw+cw*.16, w=cw*.68; let y1,y2,fill,cls;
    if(it[2]==='up'){y1=y(it[1]);y2=y(0);run=it[1];fill='var(--ink)';cls='up';}
    else if(it[2]==='dn'){y1=y(run);run+=it[1];y2=y(run);fill='var(--red)';cls='dn';}
    else {const pos=it[1]>=0; y1=pos?y(it[1]):y(0); y2=pos?y(0):y(it[1]); fill=pos?(c.ep>=T_EBIT?'var(--good)':c.ep>=8?'var(--warn)':'var(--bad)'):'var(--bad)'; cls=pos?'up':'dn';}
    const d=(i*.18).toFixed(2);
    out+=`<rect class="bar ${cls}" x="${x}" y="${y1}" width="${w}" height="${Math.max(2,y2-y1)}" rx="5" fill="${fill}" style="animation-delay:${d}s"/>`;
    if(i<6) { const ny=it[2]==='up'?y(it[1]):y(run); out+=`<line x1="${x+w}" x2="${x+cw}" y1="${ny}" y2="${ny}" stroke="var(--muted)" stroke-dasharray="3 3" opacity=".5"/>`; }
    const p=Math.abs(it[1])/c.netto*100;
    out+=`<text class="v lbl" x="${x+w/2}" y="${Math.min(y1,y2)-8}" text-anchor="middle" style="animation-delay:${(+d+.4).toFixed(2)}s">${kk(it[1])}</text>`;
    out+=`<text x="${x+w/2}" y="${bot+20}" text-anchor="middle">${it[0]}</text>`;
    out+=`<text x="${x+w/2}" y="${bot+36}" text-anchor="middle" style="font-family:var(--f-mono);font-size:11px">${i===0?'100%':pct(p)}</text>`;
  });
  return `<svg class="wf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cascata del conto economico annuo">${out}</svg>`;
}

function checklist(c){
  const n=c.netto, L=[];

  L.push({a:'A',s:sFc,t:'Food cost entro l’obiettivo',v:pct(c.fc),d:`Obiettivo per ${typeOf().label.toLowerCase()}: ${c.fcT}%. Ogni punto in più ti costa ${eur(n/100)} l'anno.`});
  L.push({a:'A',s:status(c.pp,T_PERS),t:'Costo del personale sotto il 30%',v:pct(c.pp),d:c.pp>T_PERS?'Spesso il problema non sono le persone ma i turni: mezz’ore pagate quando il locale è vuoto.':'Ben gestito. Tienilo d’occhio quando cresci.'});
  L.push({a:'A',s:status(c.prime,60,3),t:'Prime cost sotto il 60%',v:pct(c.prime),d:'Food cost più personale. È il primo numero che guardano i ristoratori che guadagnano.'});
  L.push({a:'A',s:c.ap<=T_AFF?'ok':c.ap<=11?'warn':'bad',t:'Affitto sotto il 10%',v:pct(c.ap),d:c.ap>10?'L’affitto non si tocca facilmente: si recupera con più fatturato sugli stessi metri.':'Affitto sostenibile per il tuo fatturato.'});
  L.push({a:'A',s:status(c.op,T_ALTRI,1.5),t:'Altri costi fissi sotto il 7%',v:pct(c.op),d:'Utenze, servizi, software: contratti da rinegoziare una volta l’anno.'});
  L.push({a:'A',s:c.ep>=T_EBIT?'ok':c.ep>=8?'warn':'bad',t:'Margine operativo sopra il 15%',v:pct(c.ep),d:`Oggi ti restano ${eur(c.ebit/12)} al mese. Con il 15% sarebbero ${eur(n*.15/12)}.`});
  const ce=S.ce??0, sch=S.schede??0, con=S.contatti??0;
  L.push({a:'B',s:ce>=2?'ok':ce===1?'warn':'bad',t:'Conto economico ogni mese',v:S.ns.ce?'Non lo sa':['Mai','1 volta l’anno','Mensile','Settimanale'][ce],d:ce>=2?'Ottimo: chi guarda i numeri ogni mese corregge prima.':'A fine anno è tardi: un costo che sale a febbraio lo scopri a marzo dell’anno dopo.'});
  L.push({a:'B',s:sch>=2?'ok':sch===1?'warn':'bad',t:'Scheda food cost per ogni piatto',v:S.ns.schede?'Non lo sa':['Nessuna','Vecchia','Recente','Aggiornata'][sch],d:sch>=2?'Hai la base per il menu engineering.':'Senza schede non sai quali piatti ti fanno guadagnare e quali ti costano.'});
  const nn=nsNum();
  L.push({a:'B',s:nn?'warn':'ok',t:'Numeri del locale sotto controllo',v:nn?`${nn} non noti`:'Noti',d:nn?'Alcuni numeri non li conosci: li abbiamo stimati. Sono i primi da ricostruire dalle fatture, perché senza non sai dove intervenire.':'Conosci i tuoi numeri: è il punto di partenza.'});
  L.push({a:'C',s:con===3?'ok':con===2?'warn':'bad',t:'Database clienti attivo',v:S.ns.contatti?'Non lo sa':['Nessuno','Sparso','Fermo','Automatico'][con],d:con===3?'Bene: i clienti che tornano costano zero in pubblicità.':'Ogni cliente che entra e non lascia il contatto è un cliente che devi ricomprare con la pubblicità.'});
  L.push({a:'C',s:c.mp>=2&&c.mp<=5.5?'ok':c.mp>=1?'warn':'bad',t:'Budget marketing tra 2% e 5%',v:pct(c.mp,1),d:c.mp<2?'Il marketing si misura in costo per prenotazione, non in like.':'Bene. Misuri quanto ti costa ogni prenotazione?'});
  L.forEach(x=>{if(x.s==='good')x.s='ok';});
  return L;
}

/* ---------- SIMULATORE ---------- */
function simulator(c){
  const fcMin=Math.max(c.fcT-3,15), fcMax=Math.max(Math.ceil(c.fc*2)/2,fcMin+.5);
  const persMax=Math.floor(Math.max(0,c.pp-25)*2)/2;
  const half=x=>Math.round(x*2)/2;
  const P={fc:half(Math.min(c.fc,c.fcT)), sc:5, cl:(S.contatti??0)<3?8:4, pe:half(Math.min(Math.max(0,c.pp-T_PERS),2))};
  // marketing: solo la leva dei clienti in più (le altre restano ferme a oggi)
  const ON=isM?['cl']:['fc','sc','cl','pe'];
  if(isM){ P.fc=half(Math.min(c.fc,fcMax)); P.sc=0; P.pe=0; P.cl=(S.contatti??0)<3?12:6; }
  const holder=document.getElementById('simHolder');
  holder.innerHTML=`<section class="sim" id="sim">
    <div class="eyebrow">Simulazione</div>
    <h2>Quanto ti possiamo portare</h2>
    <p class="intro">${isM?'Muovi la leva e guarda cosa valgono i clienti in più sul tuo margine. Il valore di partenza è quello che otteniamo di solito su locali come il tuo.':'Muovi le leve e guarda cosa cambia sul tuo margine. I valori di partenza sono quelli che otteniamo di solito su locali come il tuo.'}</p>
    <div class="sim-grid">
      <div class="levers">
        ${lever('fc','Menu ingegnerizzato','Food cost dopo il nuovo menu',fcMin,fcMax,.5,P.fc,v=>pct(v,1),`da ${pct(c.fc,1)}`,'obiettivo '+c.fcT+'%')}
        ${lever('sc','Scontrino medio','Prezzi giusti e piatti che rendono in evidenza',0,20,1,P.sc,v=>'+'+v+'%',`oggi ${eur(S.scontrino)}`,'')}
        ${lever('cl','Clienti in più','Campagne, CRM, recensioni, clienti che tornano',0,30,1,P.cl,v=>'+'+v+'%',`oggi ${dot(S.incasso/S.scontrino)}/mese`,'')}
        ${lever('pe','Turni ottimizzati','Costo del personale: punti in meno',0,Math.max(persMax,.5),.5,P.pe,v=>'−'+pct(v,1).replace('%',' pt'),persMax>0?`oggi ${pct(c.pp,1)}`:'già in linea','')}
      </div>
      <div>
        <div class="out-big num"><span class="plus">+</span><span id="oBig">0 €</span></div>
        <div class="out-sub">di margine in più all'anno a regime · <b id="oMonth" class="num"></b> al mese</div>
        <div class="compare">
          <span>Oggi</span><span class="cb"><i id="cbNow" style="width:0;background:var(--stage-muted)"></i></span><span class="cv num" id="cvNow"></span>
          <span>Con RBR</span><span class="cb"><i id="cbNew" style="width:0;background:#D90A0F"></i></span><span class="cv num" id="cvNew"></span>
        </div>
        <div class="tl" id="tl"></div>
        <div class="brk" id="brk"></div>
      </div>
    </div>
    ${isM?'':`<div class="proof">Un caso reale: in un ristorante che seguiamo lo scontrino medio è passato <b>da 95 € a 112 €</b> dopo il menu ingegnerizzato. Stessi clienti, più margine su ogni tavolo.</div>`}
  </section>`;
  const firstRun={v:true};
  ['fc','sc','cl','pe'].forEach(k=>{const r=document.getElementById('lv-'+k); r.addEventListener('input',()=>{P[k]=Number(r.value);paint();}); if(!ON.includes(k)) r.closest('.lever').hidden=true; });
  if(persMax<=0){const r=document.getElementById('lv-pe'); r.disabled=true; r.closest('.lever').style.opacity=.5;}
  let lastBig=0;
  function paint(){
    ['fc','sc','cl','pe'].forEach(k=>{const r=document.getElementById('lv-'+k); r.style.setProperty('--p',((r.value-r.min)/(r.max-r.min||1)*100)+'%'); document.getElementById('lvv-'+k).textContent=r.dataset.fmt==='fc'?pct(P.fc,1):k==='pe'?'−'+P.pe.toFixed(1).replace('.',',')+' pt':'+'+P[k]+'%';});
    const n=c.netto, fcN=P.fc/100, s=P.sc/100, cl=P.cl/100;
    const fcSave=n*Math.max(0,c.fc-P.fc)/100;
    const peSave=n*P.pe/100;
    const scGain=n*s*(1-fcN-.05);
    const clGain=n*(1+s)*cl*(1-fcN-.25);
    const delta=fcSave+peSave+scGain+clGain;
    const netNew=n*(1+s)*(1+cl), ebNew=c.ebit+delta, epNew=ebNew/netNew*100;
    // anno 1 mese per mese
    const rFC=m=>m<3?0:m===3?.5:1, rPE=m=>m<2?0:m===2?.5:1, rSC=m=>m<4?0:m===4?.5:1, rCL=isM?m=>Math.min(1,m/6):m=>m<5?0:Math.min(1,(m-4)/8);
    const cum=[]; let acc=0;
    for(let m=1;m<=12;m++){acc+=(fcSave*rFC(m)+peSave*rPE(m)+scGain*rSC(m)+clGain*rCL(m))/12;cum.push(acc);}
    const big=document.getElementById('oBig');
    if(firstRun.v){countUp(big,delta,v=>dot(v)+' €',1600);firstRun.v=false;} else countUp(big,delta,v=>dot(v)+' €',350,lastBig);
    lastBig=delta;
    document.getElementById('oMonth').textContent=eur(delta/12);
    const mx=Math.max(25,epNew,c.ep);
    document.getElementById('cbNow').style.width=clamp(c.ep/mx)*100+'%';
    document.getElementById('cbNew').style.width=clamp(epNew/mx)*100+'%';
    document.getElementById('cvNow').textContent=`${pct(c.ep,1)} · ${kk(c.ebit)}`;
    document.getElementById('cvNew').textContent=`${pct(epNew,1)} · ${kk(ebNew)}`;
    document.getElementById('tl').innerHTML=timelineSVG(cum);
    document.getElementById('brk').innerHTML=(isM?[['Clienti in più al mese',S.incasso/S.scontrino*cl,'n'],['Margine in più al mese',clGain/12]]:[['Menu e food cost',fcSave],['Scontrino medio',scGain],['Clienti in più',clGain],['Turni ottimizzati',peSave]]).map(x=>x[2]==='n'?`<div><small>${x[0]}</small><b class="num">+${dot(x[1])}</b></div>`:`<div><small>${x[0]}</small><b class="num">+${eur(x[1])}</b></div>`).join('');
  }
  paint();
}
function lever(k,title,sub,min,max,step,val,fmt,lo,hi){
  return `<div class="lever"><div class="lever-top"><div><b>${title}</b><small>${sub}</small></div><span class="lv num" id="lvv-${k}"></span></div>
    <input type="range" id="lv-${k}" data-fmt="${k}" min="${min}" max="${max}" step="${step}" value="${val}" aria-label="${title}">
    <div class="lg"><span>${lo}</span><span>${hi}</span></div></div>`;
}
function timelineSVG(cum){
  const W=400,H=200,l=4,r=4,t=62,b=168, max=Math.max(cum[11],1);
  const x=i=>l+(i)/(11)*(W-l-r), y=v=>b-(v/max)*(b-t);
  const bands=isM?[[0,11,'Marketing']]:[[0,1.5,'Numeri'],[1.5,3.5,'Menu'],[3.5,11,'Marketing']];
  let out=bands.map((bd,i)=>`<rect x="${x(bd[0])}" y="${t-24}" width="${x(bd[1])-x(bd[0])}" height="${b-t+24}" fill="${i%2?'rgba(217,10,15,.04)':'rgba(217,10,15,0)'}"/><text class="ph" x="${x(bd[0])+6}" y="${t-10}">${bd[2]}</text>`).join('');
  let d=`M${x(0)},${b}`; cum.forEach((v,i)=>d+=` L${x(i)},${y(v)}`); d+=` L${x(11)},${b} Z`;
  let ln=''; cum.forEach((v,i)=>ln+=(i?' L':'M')+x(i)+','+y(v));
  out+=`<defs><linearGradient id="tlg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D90A0F" stop-opacity=".45"/><stop offset="1" stop-color="#D90A0F" stop-opacity="0"/></linearGradient></defs>`;
  out+=`<line x1="${l}" x2="${W-r}" y1="${b}" y2="${b}" stroke="var(--stage-line)"/>`;
  out+=`<path d="${d}" fill="url(#tlg)"/><path d="${ln}" fill="none" stroke="#D90A0F" stroke-width="2.5" stroke-linejoin="round"/>`;
  out+=`<circle cx="${x(11)}" cy="${y(cum[11])}" r="5" fill="#D90A0F" stroke="var(--stage)" stroke-width="2"/>`;
  out+=`<text x="${l}" y="16" style="fill:var(--stage-ink);font-family:var(--f-body);font-weight:700;font-size:14px">Primo anno: +${eur(cum[11])}</text><text x="${l}" y="32">margine in più accumulato, mese per mese</text>`;
  [0,3,6,9,11].forEach(i=>out+=`<text x="${x(i)}" y="${b+20}" text-anchor="${i===0?'start':i===11?'end':'middle'}">${i===0?'Mese 1':i+1}</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Margine in più accumulato nel primo anno">${out}</svg>`;
}

function book(){
  if(CFG.booking){
    const L=S.lead||{}, p=(L.nome||'').trim().split(/\s+/), q=new URLSearchParams();
    if(p[0]) q.set('first_name',p[0]); if(p.length>1) q.set('last_name',p.slice(1).join(' ')); if(L.email) q.set('email',L.email); if(L.tel) q.set('phone',L.tel);
    track('Schedule',{content_name:'checkup-call'});
    window.open(CFG.booking+(q.toString()?(CFG.booking.includes('?')?'&':'?')+q:''),'_blank','noopener'); return;
  }
  if(CFG.live){ if(S.lead) toast('Ti scriviamo su WhatsApp entro 24 ore per fissare la call.'); else { const g=document.getElementById('g-nome'); if(g){ g.scrollIntoView({behavior:'smooth',block:'center'}); g.focus(); } else toast('Fai il check-up: alla fine ti proponiamo la call.'); } return; }
  if(document.getElementById('bookBox')) return;
  const box=h(`<div class="gate" id="bookBox" style="position:fixed;background:rgba(20,17,18,.45);padding:20px;align-items:center;z-index:60">
    <div class="gate-box" style="position:relative;top:0" role="dialog" aria-modal="true" aria-labelledby="bkT">
      <div class="lock"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></div>
      <h3 id="bkT">Scegli quando sentirci</h3>
      <p>Call gratuita di 30 minuti sul tuo conto economico.</p>
      <div class="opts list" style="margin-top:16px" id="slots">${['Domani · 10:00','Domani · 15:30','Giovedì · 11:00','Venerdì · 16:00'].map((s,i)=>`<button class="opt" data-s="${s}"><span class="key">${String.fromCharCode(65+i)}</span><span><b>${s}</b></span></button>`).join('')}</div>
      <button class="linkish" id="bkClose" style="margin-top:14px;font-size:13.5px">Chiudi</button>
    </div></div>`);
  document.body.appendChild(box);
  box.querySelector('#bkClose').addEventListener('click',()=>box.remove());
  box.addEventListener('click',e=>{if(e.target===box)box.remove();});
  box.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{box.remove();toast('Call richiesta per '+b.dataset.s+'. Ti scriviamo su WhatsApp per confermare.');}));
}

document.getElementById('homeLink').addEventListener('click',home);
document.getElementById('topCta').addEventListener('click',book);
home();
})();
</script>

</body>
</html>
